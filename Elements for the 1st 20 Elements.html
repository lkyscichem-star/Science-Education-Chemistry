<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Element Mastery & Pitfall Quiz</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & React DOM CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel CDN -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @keyframes pulse-subtle {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }
        .animate-pulse-subtle { animation: pulse-subtle 0.3s ease-in-out; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">
    <div id="root" class="w-full max-w-xl"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Dataset targeting common misconceptions and memory triggers for Elements 1-20
        const ELEMENT_QUESTIONS = [
            {
                id: 1,
                prompt: "What is the correct chemical symbol for Sodium (Atomic Number 11)?",
                target: "Symbol Traps (Latin Names)",
                options: ["So", "Na", "S", "Sd"],
                correctIndex: 1,
                hint: "Sodium derives its symbol from its historical Latin name, 'Natrium'.",
                explanation: "Common Mistake: Thinking symbol starts with 'So'. Sodium is 'Na' (Natrium)."
            },
            {
                id: 2,
                prompt: "Identify the correct capitalization for Chlorine (Atomic Number 17):",
                target: "Capitalization Rules",
                options: ["CL", "cl", "Cl", "C L"],
                correctIndex: 2,
                hint: "The first letter of a chemical symbol is ALWAYS uppercase, and the second is ALWAYS lowercase.",
                explanation: "Common Mistake: Writing both letters in uppercase (CL). The standard chemical notation is 'Cl'."
            },
            {
                id: 3,
                prompt: "Which chemical symbol represents Potassium (Atomic Number 19)?",
                target: "Symbol Traps (Latin Names)",
                options: ["P", "Po", "K", "Pt"],
                correctIndex: 2,
                hint: "Potassium takes its symbol from its Latin name, 'Kalium'. 'P' is Phosphorus!",
                explanation: "Common Mistake: Confusing Potassium (K) with Phosphorus (P)."
            },
            {
                id: 4,
                prompt: "Select the correct spelling for Element 9 (F):",
                target: "Spelling Traps",
                options: ["Flourine", "Fluorine", "Florine", "Fluorene"],
                correctIndex: 1,
                hint: "Think 'Fluo-' (like fluorescent), not 'Flour-' (like baking flour).",
                explanation: "Common Mistake: Writing 'Flourine' (o before u). The correct spelling is 'Fluorine'."
            },
            {
                id: 5,
                prompt: "What is the atomic number of Carbon?",
                target: "Atomic Number Order",
                options: ["12", "6", "14", "8"],
                correctIndex: 1,
                hint: "Don't confuse atomic number (protons) with mass number (protons + neutrons ~ 12).",
                explanation: "Common Mistake: Confusing mass number (12) with atomic number (6)."
            },
            {
                id: 6,
                prompt: "What is the symbol for Magnesium (Atomic Number 12)?",
                target: "Letter Confusion",
                options: ["Mn", "Mg", "Ma", "MS"],
                correctIndex: 1,
                hint: "Magnesium is 'Mg'. 'Mn' is Manganese (Element 25).",
                explanation: "Common Mistake: Writing 'Mn' for Magnesium. Manganese is 'Mn'."
            },
            {
                id: 7,
                prompt: "Which element has Atomic Number 15 and symbol 'P'?",
                target: "Name Confusion",
                options: ["Potassium", "Phosphorus", "Potassium-15", "Plumbum"],
                correctIndex: 1,
                hint: "'P' stands for Phosphorus. Potassium is 'K'.",
                explanation: "Common Mistake: Mixing up Phosphorus (P) with Potassium (K)."
            },
            {
                id: 8,
                prompt: "What is the chemical symbol for Silicon (Atomic Number 14)?",
                target: "Symbol Accuracy",
                options: ["S", "Si", "Sc", "Sl"],
                correctIndex: 1,
                hint: "'S' is Sulfur. Silicon requires two letters.",
                explanation: "Common Mistake: Writing 'S' for Silicon. 'S' is Sulfur; Silicon is 'Si'."
            },
            {
                id: 9,
                prompt: "Identify the noble gas with Atomic Number 18:",
                target: "Group Characteristics",
                options: ["Argon (Ar)", "Neon (Ne)", "Helium (He)", "Krypton (Kr)"],
                correctIndex: 0,
                hint: "Helium is 2, Neon is 10, and the 3rd period noble gas is...",
                explanation: "Common Mistake: Confusing period 2 and period 3 noble gases. Element 18 is Argon."
            },
            {
                id: 10,
                prompt: "What is the symbol for Calcium (Atomic Number 20)?",
                target: "First 20 Boundary",
                options: ["C", "Ca", "Cl", "K"],
                correctIndex: 1,
                hint: "'C' is Carbon, 'Cl' is Chlorine, 'K' is Potassium.",
                explanation: "Common Mistake: Selecting 'C' or 'Cl' instead of 'Ca'."
            }
        ];

        const QuizApp = () => {
            const [gameState, setGameState] = useState('welcome'); // welcome, quiz, summary
            const [currentIndex, setCurrentIndex] = useState(0);
            const [selectedOption, setSelectedOption] = useState(null);
            const [showHint, setShowHint] = useState(false);
            const [score, setScore] = useState(0);
            const [userHistory, setUserHistory] = useState([]);

            const currentQ = ELEMENT_QUESTIONS[currentIndex];

            const handleStart = () => {
                setGameState('quiz');
                setCurrentIndex(0);
                setScore(0);
                setSelectedOption(null);
                setShowHint(false);
                setUserHistory([]);
            };

            const handleSelectOption = (index) => {
                if (selectedOption !== null) return;
                setSelectedOption(index);
                const isCorrect = index === currentQ.correctIndex;
                if (isCorrect) setScore(prev => prev + 1);

                setUserHistory(prev => [...prev, {
                    question: currentQ,
                    userAnswer: index,
                    isCorrect
                }]);
            };

            const handleNext = () => {
                if (currentIndex + 1 < ELEMENT_QUESTIONS.length) {
                    setCurrentIndex(prev => prev + 1);
                    setSelectedOption(null);
                    setShowHint(false);
                } else {
                    setGameState('summary');
                }
            };

            return (
                <div className="bg-slate-800 rounded-2xl shadow-2xl border border-slate-700 p-6 md:p-8">
                    {/* Welcome Screen */}
                    {gameState === 'welcome' && (
                        <div className="text-center space-y-6">
                            <div className="inline-block p-4 bg-emerald-500/10 rounded-full text-emerald-400 mb-2">
                                <svg className="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" />
                                </svg>
                            </div>
                            <h1 className="text-3xl font-extrabold text-white">Element Pitfalls & Mastery</h1>
                            <p className="text-slate-400 text-sm md:text-base leading-relaxed">
                                Master elements 1 to 20! This quiz focuses on common traps student chemistry beginners fall into—like symbol capitalizations, Latin root symbols (Na, K), and tricky spellings.
                            </p>
                            <button 
                                onClick={handleStart}
                                className="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-3.5 px-6 rounded-xl transition duration-200 shadow-lg shadow-emerald-500/20"
                            >
                                Start Chemistry Challenge
                            </button>
                        </div>
                    )}

                    {/* Quiz Screen */}
                    {gameState === 'quiz' && (
                        <div>
                            {/* Header / Progress */}
                            <div className="flex justify-between items-center mb-6 text-sm font-semibold text-slate-400">
                                <span>Question {currentIndex + 1} of {ELEMENT_QUESTIONS.length}</span>
                                <span className="bg-slate-700/60 px-3 py-1 rounded-full text-slate-300">
                                    Target: {currentQ.target}
                                </span>
                            </div>

                            {/* Progress Bar */}
                            <div className="w-full bg-slate-700 h-2 rounded-full mb-6 overflow-hidden">
                                <div 
                                    className="bg-emerald-500 h-full transition-all duration-300"
                                    style={{ width: `${((currentIndex + 1) / ELEMENT_QUESTIONS.length) * 100}%` }}
                                ></div>
                            </div>

                            {/* Question Prompt */}
                            <h2 className="text-xl md:text-2xl font-bold text-white mb-6">
                                {currentQ.prompt}
                            </h2>

                            {/* Options */}
                            <div className="space-y-3 mb-6">
                                {currentQ.options.map((opt, idx) => {
                                    let btnStyle = "bg-slate-700/50 hover:bg-slate-700 border-slate-600 text-slate-200";
                                    
                                    if (selectedOption !== null) {
                                        if (idx === currentQ.correctIndex) {
                                            btnStyle = "bg-emerald-500/20 border-emerald-500 text-emerald-300 font-bold";
                                        } else if (idx === selectedOption) {
                                            btnStyle = "bg-rose-500/20 border-rose-500 text-rose-300 font-bold";
                                        } else {
                                            btnStyle = "bg-slate-800/40 border-slate-700/50 text-slate-500 opacity-50";
                                        }
                                    }

                                    return (
                                        <button
                                            key={idx}
                                            onClick={() => handleSelectOption(idx)}
                                            disabled={selectedOption !== null}
                                            className={`w-full text-left p-4 rounded-xl border text-base transition duration-150 flex justify-between items-center ${btnStyle}`}
                                        >
                                            <span>{opt}</span>
                                            {selectedOption !== null && idx === currentQ.correctIndex && (
                                                <span className="text-emerald-400 text-sm">✓ Correct</span>
                                            )}
                                            {selectedOption === idx && idx !== currentQ.correctIndex && (
                                                <span className="text-rose-400 text-sm">✗ Incorrect</span>
                                            )}
                                        </button>
                                    );
                                })}
                            </div>

                            {/* Hint Section */}
                            {!showHint && selectedOption === null && (
                                <button 
                                    onClick={() => setShowHint(true)}
                                    className="text-xs text-amber-400/80 hover:text-amber-400 underline underline-offset-4 flex items-center gap-1 mb-6"
                                >
                                    💡 Need a memory hint?
                                </button>
                            )}

                            {showHint && selectedOption === null && (
                                <div className="bg-amber-500/10 border border-amber-500/30 text-amber-300 p-3.5 rounded-xl text-sm mb-6 animate-pulse-subtle">
                                    💡 <strong>Hint:</strong> {currentQ.hint}
                                </div>
                            )}

                            {/* Explanation Card after selection */}
                            {selectedOption !== null && (
                                <div className="bg-slate-900/80 border border-slate-700 p-4 rounded-xl text-sm text-slate-300 mb-6">
                                    <p className="font-semibold text-emerald-400 mb-1">Teacher Notes:</p>
                                    <p>{currentQ.explanation}</p>
                                </div>
                            )}

                            {/* Next Button */}
                            {selectedOption !== null && (
                                <button
                                    onClick={handleNext}
                                    className="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-3.5 px-6 rounded-xl transition duration-200 shadow-lg shadow-emerald-500/20"
                                >
                                    {currentIndex + 1 === ELEMENT_QUESTIONS.length ? "View Final Score" : "Next Question →"}
                                </button>
                            )}
                        </div>
                    )}

                    {/* Summary Screen */}
                    {gameState === 'summary' && (
                        <div className="space-y-6">
                            <div className="text-center">
                                <h2 className="text-3xl font-extrabold text-white mb-2">Quiz Complete!</h2>
                                <p className="text-slate-400">Here is how you performed on common element traps:</p>
                                <div className="mt-4 text-4xl font-black text-emerald-400">
                                    {score} <span className="text-xl font-normal text-slate-500">/ {ELEMENT_QUESTIONS.length}</span>
                                </div>
                            </div>

                            {/* Mistake Review */}
                            <div className="space-y-3 max-h-64 overflow-y-auto pr-2">
                                <h3 className="text-sm font-semibold text-slate-400 uppercase tracking-wider">Review Traps:</h3>
                                {userHistory.map((item, idx) => (
                                    <div 
                                        key={idx} 
                                        className={`p-3 rounded-xl border text-xs leading-relaxed ${
                                            item.isCorrect 
                                                ? 'bg-emerald-950/20 border-emerald-800/40 text-slate-300' 
                                                : 'bg-rose-950/20 border-rose-800/40 text-slate-300'
                                        }`}
                                    >
                                        <div className="font-bold mb-1 text-slate-200">
                                            Q{idx + 1}: {item.question.prompt}
                                        </div>
                                        <p className={item.isCorrect ? "text-emerald-400" : "text-rose-400"}>
                                            Your answer: {item.question.options[item.userAnswer]} {item.isCorrect ? "✓" : "✗"}
                                        </p>
                                        {!item.isCorrect && (
                                            <p className="text-emerald-400 mt-0.5">
                                                Correct: {item.question.options[item.question.correctIndex]}
                                            </p>
                                        )}
                                        <p className="text-slate-400 mt-1 italic">{item.question.explanation}</p>
                                    </div>
                                ))}
                            </div>

                            <button 
                                onClick={handleStart}
                                className="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-3.5 px-6 rounded-xl transition duration-200 shadow-lg shadow-emerald-500/20"
                            >
                                Try Again 🔄
                            </button>
                        </div>
                    )}
                </div>
            );
        };

        ReactDOM.render(<QuizApp />, document.getElementById('root'));
    </script>
</body>
</html>
