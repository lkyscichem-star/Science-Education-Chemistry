<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chemistry Practice App</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React Libraries -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel to translate JSX in the browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        /* Custom font and animations */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }
        @keyframes fade-in {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fade-in 0.5s ease-out forwards; }
    </style>
</head>
<body class="bg-gray-50">

    <div id="root"></div>

    <!-- The React code goes inside a script tag with type="text/babel" -->
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Data for the Quiz ---
        const partAData = [
            { "Name of substance": "calcium carbonate", "Cation": "Ca²⁺", "Anion": "CO₃²⁻", "Chemical formula": "CaCO₃" },
            { "Name of substance": "copper(II) permanganate", "Cation": "Cu²⁺", "Anion": "MnO₄⁻", "Chemical formula": "Cu(MnO₄)₂" },
            { "Name of substance": "iron(III) sulphate", "Cation": "Fe³⁺", "Anion": "SO₄²⁻", "Chemical formula": "Fe₂(SO₄)₃" },
            { "Name of substance": "nickel(II) oxide", "Cation": "Ni²⁺", "Anion": "O²⁻", "Chemical formula": "NiO" },
            { "Name of substance": "zinc phosphate", "Cation": "Zn²⁺", "Anion": "PO₄³⁻", "Chemical formula": "Zn₃(PO₄)₂" },
            { "Name of substance": "silver hydrogencarbonate", "Cation": "Ag⁺", "Anion": "HCO₃⁻", "Chemical formula": "AgHCO₃" },
            { "Name of substance": "magnesium dichromate", "Cation": "Mg²⁺", "Anion": "Cr₂O₇²⁻", "Chemical formula": "MgCr₂O₇" },
            { "Name of substance": "potassium iodide", "Cation": "K⁺", "Anion": "I⁻", "Chemical formula": "KI" },
            { "Name of substance": "sodium hydroxide", "Cation": "Na⁺", "Anion": "OH⁻", "Chemical formula": "NaOH" },
            { "Name of substance": "aluminium sulphate", "Cation": "Al³⁺", "Anion": "SO₄²⁻", "Chemical formula": "Al₂(SO₄)₃" },
        ];

        const partBData = [
            { "Common name of acid": "hydrochloric acid", "Cation": "H⁺", "Anion": "Cl⁻", "Chemical formula": "HCl" },
            { "Common name of acid": "sulphuric acid", "Cation": "H⁺", "Anion": "SO₄²⁻", "Chemical formula": "H₂SO₄" },
            { "Common name of acid": "nitric acid", "Cation": "H⁺", "Anion": "NO₃⁻", "Chemical formula": "HNO₃" },
            { "Common name of acid": "phosphoric acid", "Cation": "H⁺", "Anion": "PO₄³⁻", "Chemical formula": "H₃PO₄" },
            { "Common name of acid": "ethanoic acid", "Cation": "H⁺", "Anion": "CH₃COO⁻", "Chemical formula": "CH₃COOH" },
        ];

        const partCData = [
            { "Chemical formula": "CaO", "Chemical name": "calcium oxide" },
            { "Chemical formula": "CuCl₂", "Chemical name": "copper(II) chloride" },
            { "Chemical formula": "Ca(NO₂)₂", "Chemical name": "calcium nitrite" },
            { "Chemical formula": "Fe₂(SO₃)₃", "Chemical name": "iron(III) sulphite" },
            { "Chemical formula": "Na₂SO₃", "Chemical name": "sodium sulphite" },
            { "Chemical formula": "KMnO₄", "Chemical name": "potassium permanganate" },
            { "Chemical formula": "NH₄Cl", "Chemical name": "ammonium chloride" },
            { "Chemical formula": "Ca(NO₃)₂", "Chemical name": "calcium nitrate" },
            { "Chemical formula": "ZnSO₄", "Chemical name": "zinc sulphate" },
            { "Chemical formula": "NaHCO₃", "Chemical name": "sodium hydrogencarbonate" },
            { "Chemical formula": "PbO", "Chemical name": "lead(II) oxide" },
            { "Chemical formula": "K₂Cr₂O₇", "Chemical name": "potassium dichromate" },
        ];

        // --- Helper Functions ---
        const shuffleAndPick = (arr, count) => {
            return [...arr].sort(() => 0.5 - Math.random()).slice(0, count);
        };

        // --- Components ---
        const FormattingHelper = ({ onInsert, disabled }) => {
            const symbols = [
                '⁺', '²⁺', '³⁺', '⁻', '²⁻', '³⁻',
                '₁', '₂', '₃', '₄', '₅', '₆', '₇', '₈', '₉', '₀',
                '(', ')'
            ];

            return (
                <div className={`bg-gray-100 p-3 rounded-lg mt-4 ${disabled ? 'opacity-50' : ''}`}>
                    <h3 className="text-sm font-semibold text-gray-700 mb-2">Formatting Helper</h3>
                    <div className="grid grid-cols-6 gap-2">
                        {symbols.map(symbol => (
                            <button
                                key={symbol}
                                onClick={() => onInsert(symbol)}
                                disabled={disabled}
                                className="bg-white hover:bg-blue-100 text-gray-800 font-mono py-2 px-2 rounded-md border border-gray-300 transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:bg-gray-200 disabled:cursor-not-allowed"
                            >
                                {symbol}
                            </button>
                        ))}
                    </div>
                </div>
            );
        };

        const Results = ({ score, total, wrongAnswers, onRestart }) => (
            <div className="w-full max-w-2xl mx-auto p-6 bg-white rounded-xl shadow-lg animate-fade-in">
                <h2 className="text-3xl font-bold text-center text-gray-800 mb-4">Quiz Complete!</h2>
                <p className="text-center text-xl text-gray-600 mb-6">
                    Your score: <span className="font-bold text-blue-600">{score}</span> / {total}
                </p>

                {wrongAnswers.length > 0 && (
                    <div className="mb-6">
                        <h3 className="text-xl font-semibold text-red-600 mb-3 border-b pb-2">Review Your Mistakes</h3>
                        <div className="space-y-4 max-h-60 overflow-y-auto pr-2">
                            {wrongAnswers.map((item, index) => (
                                <div key={index} className="bg-red-50 p-3 rounded-lg border border-red-200">
                                    <p className="font-semibold text-gray-700 mb-2">
                                        <span className="font-bold">{item.prompt.key}:</span> {item.prompt.value}
                                    </p>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-x-4 gap-y-2 text-sm">
                                        {Object.entries(item.answers).map(([key, values]) => (
                                            <div key={key}>
                                                <p className="font-semibold text-gray-600">{key}:</p>
                                                <p className="text-red-500 line-through">Your answer: {values.user}</p>
                                                <p className="text-green-600">Correct answer: {values.correct}</p>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                )}

                {wrongAnswers.length === 0 && (
                     <div className="text-center p-6 bg-green-50 rounded-lg border border-green-200">
                        <p className="text-2xl font-semibold text-green-700">🎉 Perfect Score! 🎉</p>
                        <p className="text-gray-600 mt-2">Excellent work, you know your chemistry!</p>
                    </div>
                )}

                <button
                    onClick={onRestart}
                    className="w-full mt-6 bg-blue-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-blue-700 transition-transform transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500"
                >
                    Play Again
                </button>
            </div>
        );

        const Game = ({ gameConfig, onBack }) => {
            const [questions, setQuestions] = useState([]);
            const [currentQuestionIndex, setCurrentQuestionIndex] = useState(0);
            const [userAnswers, setUserAnswers] = useState({});
            const [gameState, setGameState] = useState('playing');
            const [score, setScore] = useState(0);
            const [wrongAnswers, setWrongAnswers] = useState([]);
            const [activeInput, setActiveInput] = useState(null);
            const [questionState, setQuestionState] = useState('answering');
            const [feedback, setFeedback] = useState({});

            useEffect(() => {
                const selectedQuestions = shuffleAndPick(gameConfig.data, gameConfig.count);
                const preparedQuestions = selectedQuestions.map(q => {
                    const keys = Object.keys(q);
                    const promptKey = Math.random() < 0.5 ? gameConfig.promptFields[0] : gameConfig.promptFields[1];
                    const answerKeys = keys.filter(k => k !== promptKey);
                    return {
                        prompt: { key: promptKey, value: q[promptKey] },
                        answers: answerKeys.reduce((acc, key) => { acc[key] = q[key]; return acc; }, {})
                    };
                });
                setQuestions(preparedQuestions);
                setUserAnswers({});
            }, [gameConfig]);

            const handleInputChange = (key, value) => {
                setUserAnswers(prev => ({ ...prev, [key]: value }));
            };
            
            const handleInputFocus = (e) => {
                setActiveInput(e.target);
            };

            const handleInsertSymbol = (symbol) => {
                if (!activeInput || questionState === 'submitted') return;
                const { selectionStart, selectionEnd, name } = activeInput;
                const currentValue = userAnswers[name] || '';
                const newValue = currentValue.substring(0, selectionStart) + symbol + currentValue.substring(selectionEnd);
                handleInputChange(name, newValue);
                setTimeout(() => {
                    activeInput.focus();
                    activeInput.setSelectionRange(selectionStart + symbol.length, selectionStart + symbol.length);
                }, 0);
            };

            const handleSubmitAnswer = () => {
                const currentQ = questions[currentQuestionIndex];
                let isAllCorrect = true;
                const currentFeedback = {};
                Object.keys(currentQ.answers).forEach(key => {
                    const userAnswer = (userAnswers[key] || "").trim();
                    const correctAnswer = currentQ.answers[key].trim();
                    if (userAnswer.toLowerCase() === correctAnswer.toLowerCase()) {
                        currentFeedback[key] = { isCorrect: true, correct: correctAnswer };
                    } else {
                        isAllCorrect = false;
                        currentFeedback[key] = { isCorrect: false, correct: correctAnswer };
                    }
                });
                setFeedback(currentFeedback);
                setQuestionState('submitted');
                if (isAllCorrect) {
                    setScore(prev => prev + 1);
                } else {
                    const wrongDetails = { prompt: currentQ.prompt, answers: {} };
                    Object.keys(currentQ.answers).forEach(key => {
                        wrongDetails.answers[key] = { user: (userAnswers[key] || "").trim() || 'No answer', correct: currentQ.answers[key] };
                    });
                    setWrongAnswers(prev => [...prev, wrongDetails]);
                }
            };

            const handleGoToNext = () => {
                if (currentQuestionIndex < questions.length - 1) {
                    setCurrentQuestionIndex(prev => prev + 1);
                    setUserAnswers({});
                    setFeedback({});
                    setQuestionState('answering');
                } else {
                    setGameState('results');
                }
            };

            const restartGame = () => {
                setCurrentQuestionIndex(0);
                setUserAnswers({});
                setScore(0);
                setWrongAnswers([]);
                setGameState('playing');
                setQuestionState('answering');
                setFeedback({});
                const selectedQuestions = shuffleAndPick(gameConfig.data, gameConfig.count);
                const preparedQuestions = selectedQuestions.map(q => {
                    const keys = Object.keys(q);
                    const promptKey = Math.random() < 0.5 ? gameConfig.promptFields[0] : gameConfig.promptFields[1];
                    const answerKeys = keys.filter(k => k !== promptKey);
                    return {
                        prompt: { key: promptKey, value: q[promptKey] },
                        answers: answerKeys.reduce((acc, key) => { acc[key] = q[key]; return acc; }, {})
                    };
                });
                setQuestions(preparedQuestions);
            };

            if (gameState === 'results') {
                return <Results score={score} total={questions.length} wrongAnswers={wrongAnswers} onRestart={restartGame} />;
            }

            if (questions.length === 0) {
                return <div className="text-center text-gray-500">Loading questions...</div>;
            }

            const currentQuestion = questions[currentQuestionIndex];

            return (
                <div className="w-full max-w-2xl mx-auto p-4 sm:p-6 relative">
                    <button onClick={onBack} className="absolute top-4 left-4 bg-gray-200 text-gray-700 px-4 py-2 rounded-lg hover:bg-gray-300 transition">&larr; Back to Menu</button>
                    <div className="bg-white rounded-xl shadow-lg p-6 animate-fade-in mt-12 sm:mt-0">
                        <div className="flex justify-between items-center mb-4">
                            <h2 className="text-xl sm:text-2xl font-bold text-gray-800">{gameConfig.title}</h2>
                            <span className="text-md font-semibold text-gray-500 bg-gray-100 px-3 py-1 rounded-full">
                                {currentQuestionIndex + 1} / {questions.length}
                            </span>
                        </div>
                        <div className="bg-blue-50 p-4 rounded-lg mb-4 border border-blue-200">
                            <p className="text-gray-600 font-medium">{currentQuestion.prompt.key}:</p>
                            <p className="text-xl font-bold text-blue-800">{currentQuestion.prompt.value}</p>
                        </div>
                        <div className="space-y-4">
                            {Object.keys(currentQuestion.answers).map(key => {
                                const isSubmitted = questionState === 'submitted';
                                const isCorrect = isSubmitted && feedback[key]?.isCorrect;
                                const borderColor = isSubmitted ? (isCorrect ? 'border-green-500' : 'border-red-500') : 'border-gray-300';
                                const ringColor = isSubmitted ? (isCorrect ? 'focus:ring-green-500' : 'focus:ring-red-500') : 'focus:ring-blue-500';
                                return (
                                    <div key={key}>
                                        <label className="block text-sm font-medium text-gray-700 mb-1">{key}</label>
                                        <div className="relative">
                                            <input
                                                type="text"
                                                name={key}
                                                value={userAnswers[key] || ''}
                                                onChange={(e) => handleInputChange(key, e.target.value)}
                                                onFocus={handleInputFocus}
                                                disabled={isSubmitted}
                                                className={`w-full px-3 py-2 border ${borderColor} rounded-md shadow-sm focus:outline-none focus:ring-2 ${ringColor} transition-colors disabled:bg-gray-50`}
                                                autoComplete="off"
                                            />
                                            {isSubmitted && (
                                                <div className="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
                                                    {isCorrect ? (
                                                        <svg className="h-5 w-5 text-green-500" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                                                            <path fillRule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clipRule="evenodd" />
                                                        </svg>
                                                    ) : (
                                                        <svg className="h-5 w-5 text-red-500" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                                                            <path fillRule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clipRule="evenodd" />
                                                        </svg>
                                                    )}
                                                </div>
                                            )}
                                        </div>
                                        {isSubmitted && !isCorrect && (
                                            <p className="text-sm text-green-700 mt-1">
                                                Correct answer: <span className="font-semibold">{feedback[key]?.correct}</span>
                                            </p>
                                        )}
                                    </div>
                                )
                            })}
                        </div>
                        <FormattingHelper onInsert={handleInsertSymbol} disabled={questionState === 'submitted'} />
                        {questionState === 'answering' ? (
                             <button
                                onClick={handleSubmitAnswer}
                                className="w-full mt-6 bg-blue-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-blue-700 transition-transform transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500"
                            >
                                Submit Answer
                            </button>
                        ) : (
                            <button
                                onClick={handleGoToNext}
                                className="w-full mt-6 bg-green-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-green-700 transition-transform transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500"
                            >
                                {currentQuestionIndex === questions.length - 1 ? 'Finish & See Score' : 'Next Question'}
                            </button>
                        )}
                    </div>
                </div>
            );
        };

        function App() {
            const [gameMode, setGameMode] = useState(null);

            const gameConfigs = {
                A: { title: 'Part A: Substances', data: partAData, count: 10, promptFields: ['Name of substance', 'Chemical formula'] },
                B: { title: 'Part B: Common Acids', data: partBData, count: 3, promptFields: ['Common name of acid', 'Chemical formula'] },
                C: { title: 'Part C: Chemical Names', data: partCData, count: 8, promptFields: ['Chemical name', 'Chemical formula'] }
            };

            const renderContent = () => {
                if (gameMode) {
                    return <Game gameConfig={gameConfigs[gameMode]} onBack={() => setGameMode(null)} />;
                }
                return (
                    <div className="w-full max-w-md mx-auto p-6 bg-white rounded-xl shadow-lg text-center animate-fade-in">
                        <h1 className="text-3xl font-bold text-gray-800 mb-2">Chemistry Practice</h1>
                        <p className="text-gray-600 mb-8">Choose a section to begin.</p>
                        <div className="space-y-4">
                            <button onClick={() => setGameMode('A')} className="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-blue-700 transition-transform transform hover:scale-105">Part A: Substances</button>
                            <button onClick={() => setGameMode('B')} className="w-full bg-purple-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-purple-700 transition-transform transform hover:scale-105">Part B: Common Acids</button>
                            <button onClick={() => setGameMode('C')} className="w-full bg-teal-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-teal-700 transition-transform transform hover:scale-105">Part C: Chemical Names</button>
                        </div>
                    </div>
                );
            };

            return (
                <div className="min-h-screen flex items-center justify-center p-4">
                    {renderContent()}
                </div>
            );
        }

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>

</body>
</html>
