<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formula Writer</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React and Babel for running the app in the browser -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif; }
        .correct-animation { animation: correct-pulse 0.5s ease; }
        @keyframes correct-pulse {
            0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); }
        }
        .incorrect-animation { animation: incorrect-shake 0.5s ease; }
        @keyframes incorrect-shake {
            0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); }
        }
        .disabled-button { cursor: not-allowed; background-color: #d1d5db; }
    </style>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen p-4">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- NEW LIST OF IONS AND COMPOUNDS ---
        const FORMULAS = [
            { name: 'sodium ion', formula: 'Na⁺' }, { name: 'chloride ion', formula: 'Cl⁻' },
            { name: 'iron (II) ion', formula: 'Fe²⁺' }, { name: 'sulphide ion', formula: 'S²⁻' },
            { name: 'aluminum ion', formula: 'Al³⁺' }, { name: 'nitride ion', formula: 'N³⁻' },
            { name: 'water', formula: 'H₂O' }, { name: 'carbon dioxide', formula: 'CO₂' },
            { name: 'ammonium ion', formula: 'NH₄⁺' }, { name: 'sulphate ion', formula: 'SO₄²⁻' },
            { name: 'hydroxide ion', formula: 'OH⁻' }, { name: 'nitrate ion', formula: 'NO₃⁻' },
            { name: 'carbonate ion', formula: 'CO₃²⁻' }, { name: 'phosphate ion', formula: 'PO₄³⁻' },
            { name: 'methane', formula: 'CH₄' }
        ];

        const shuffle = (array) => [...array].sort(() => Math.random() - 0.5);

        const PhaseIndicator = ({ phase }) => {
            const phases = [
                { id: 'study', name: 'Phase 1: Study' },
                { id: 'practice', name: 'Phase 2: Practice' },
                { id: 'summary', name: 'Phase 3: Summary' }
            ];
            const currentPhaseIndex = phases.findIndex(p => p.id === phase);
            return (
                <div className="flex justify-center space-x-2 sm:space-x-4 mb-4">
                    {phases.map((p, index) => (
                        <div key={p.id} className={`text-center p-2 rounded-lg text-xs sm:text-sm transition-all duration-300 ${index === currentPhaseIndex ? 'bg-blue-500 text-white font-bold' : 'bg-slate-200 text-slate-600'}`}>
                            {p.name}
                        </div>
                    ))}
                </div>
            );
        };

        const StudyMode = ({ onExit }) => {
            const [currentIndex, setCurrentIndex] = useState(0);
            const item = FORMULAS[currentIndex];
            return (
                 <div className="w-full max-w-lg mx-auto p-4 sm:p-6 bg-white rounded-2xl shadow-2xl">
                    <PhaseIndicator phase="study" />
                    <div className="text-center bg-slate-50 p-8 rounded-xl border border-slate-200">
                        <div className="text-5xl sm:text-7xl font-bold text-slate-800">{item.formula}</div>
                        <div className="text-2xl sm:text-3xl text-slate-700 mt-2">{item.name}</div>
                    </div>
                    <div className="flex justify-between mt-6">
                        <button onClick={() => setCurrentIndex(prev => (prev > 0 ? prev - 1 : FORMULAS.length - 1))} className="bg-slate-500 text-white font-bold py-3 px-6 rounded-lg hover:bg-slate-600">Previous</button>
                        <button onClick={onExit} className="bg-blue-500 text-white font-bold py-3 px-6 rounded-lg hover:bg-blue-600">Exit Study</button>
                        <button onClick={() => setCurrentIndex(prev => (prev < FORMULAS.length - 1 ? prev + 1 : 0))} className="bg-slate-500 text-white font-bold py-3 px-6 rounded-lg hover:bg-slate-600">Next</button>
                    </div>
                </div>
            );
        };
        
        const PracticeMode = ({ onExit }) => {
            const [questions, setQuestions] = useState([]);
            const [currentQuestionIndex, setCurrentQuestionIndex] = useState(0);
            const [userAnswer, setUserAnswer] = useState('');
            const [isAnswered, setIsAnswered] = useState(false);
            const [isCorrect, setIsCorrect] = useState(false);
            const [score, setScore] = useState(0);
            const [sessionMistakes, setSessionMistakes] = useState(new Set());
            const [isFinished, setIsFinished] = useState(false);
            const inputRef = useRef(null);

            useEffect(() => {
                setQuestions(shuffle(FORMULAS).slice(0, 10));
            }, []);

            const handleRubricClick = (char) => {
                setUserAnswer(prev => prev + char);
                inputRef.current.focus();
            };

            const checkAnswer = () => {
                const correctAnswer = questions[currentQuestionIndex].formula;
                const isMatch = userAnswer.trim() === correctAnswer.trim();
                setIsCorrect(isMatch);
                setIsAnswered(true);
                if (isMatch) {
                    setScore(prev => prev + 1);
                } else {
                    setSessionMistakes(prev => new Set(prev).add(questions[currentQuestionIndex].name));
                }
            };
            
            const nextQuestion = () => {
                if (currentQuestionIndex < questions.length - 1) {
                    setCurrentQuestionIndex(prev => prev + 1);
                } else {
                    setIsFinished(true);
                }
                setIsAnswered(false);
                setUserAnswer('');
            };

            if (isFinished) {
                return (
                    <div className="w-full max-w-lg mx-auto p-4 sm:p-6 bg-white rounded-2xl shadow-2xl">
                        <PhaseIndicator phase="summary" />
                        <div className="text-center p-8">
                            <h1 className="text-3xl font-bold text-slate-800 mb-2">Practice Complete!</h1>
                            <p className="text-slate-600 mb-4 text-2xl">Your Final Score: <span className="font-bold text-blue-600">{score}/10</span></p>
                            {sessionMistakes.size > 0 && (
                                <div className="mt-4 text-left">
                                    <h3 className="font-bold text-slate-700 text-lg mb-2">Formulas to review:</h3>
                                    <div className="space-y-2 text-left bg-slate-100 p-3 rounded-lg">
                                        {Array.from(sessionMistakes).map(name => {
                                            const item = FORMULAS.find(i => i.name === name);
                                            return (
                                                <div key={item.name} className="flex justify-between items-center p-2 bg-white rounded shadow-sm">
                                                    <span className="font-bold text-slate-700">{item.name}</span>
                                                    <span className="text-slate-500 font-mono text-lg">{item.formula}</span>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            )}
                            <button onClick={onExit} className="mt-6 bg-blue-500 text-white font-bold py-3 px-8 rounded-lg text-xl hover:bg-blue-600">Back to Start</button>
                        </div>
                    </div>
                );
            }

            if (questions.length === 0) return <div>Loading...</div>;

            const currentQuestion = questions[currentQuestionIndex];
            const CHARACTER_RUBRIC = ['⁺', '⁻', '²', '³', '⁴', '₂', '₃', '₄'];

            return (
                <div className="w-full max-w-lg mx-auto p-4 sm:p-6 bg-white rounded-2xl shadow-2xl">
                    <PhaseIndicator phase="practice" />
                    <div className="flex justify-between items-center mb-4">
                        <div className="font-bold text-xl text-slate-700">Score: {score}</div>
                        <div className="font-bold text-xl text-slate-500">{currentQuestionIndex + 1} / {questions.length}</div>
                    </div>

                    <div className={`space-y-4 p-6 rounded-xl bg-slate-50 border border-slate-200 ${isAnswered && (isCorrect ? 'correct-animation' : 'incorrect-animation')}`}>
                        <div>
                            <label className="block text-slate-600 font-medium mb-1">Name</label>
                            <div className="w-full bg-white border-2 border-slate-300 rounded-lg p-3 text-lg font-bold text-slate-800">{currentQuestion.name}</div>
                        </div>
                        <div>
                            <label className="block text-slate-600 font-medium mb-1">Formula</label>
                            <input
                                ref={inputRef}
                                type="text"
                                value={userAnswer}
                                onChange={(e) => !isAnswered && setUserAnswer(e.target.value)}
                                className={`w-full border-2 rounded-lg p-3 text-lg ${isAnswered ? 'bg-slate-200' : 'bg-white'} ${isAnswered && isCorrect ? 'border-green-500' : ''} ${isAnswered && !isCorrect ? 'border-red-500' : ''}`}
                                placeholder="Enter Formula..."
                                disabled={isAnswered}
                            />
                             {isAnswered && !isCorrect && <div className="text-red-600 font-semibold mt-1">Correct: {currentQuestion.formula}</div>}
                        </div>
                        {/* --- NEW: Formatting Helper Rubric --- */}
                        <div className="pt-2">
                             <label className="block text-slate-500 text-sm font-medium mb-2">Formatting Helper</label>
                             <div className="grid grid-cols-4 gap-2">
                                {CHARACTER_RUBRIC.map(char => (
                                    <button key={char} onClick={() => handleRubricClick(char)} className="bg-slate-200 text-slate-700 font-bold py-2 rounded-lg hover:bg-slate-300">
                                        {char}
                                    </button>
                                ))}
                             </div>
                        </div>
                    </div>
                    
                    {isAnswered && (
                        <div className="text-center my-4 h-10 flex items-center justify-center">
                            {isCorrect ? <h2 className="text-green-600 font-bold text-4xl animate-pulse">YES! ✅</h2> : <h2 className="text-red-600 font-bold text-4xl">NO ❌</h2>}
                        </div>
                    )}

                    <div className="mt-2">
                        {isAnswered ? (
                            <button onClick={nextQuestion} className="w-full bg-blue-500 text-white font-bold py-4 rounded-lg text-xl hover:bg-blue-600">Next</button>
                        ) : (
                            <button onClick={checkAnswer} className={`w-full bg-green-500 text-white font-bold py-4 rounded-lg text-xl transition-colors ${!userAnswer.trim() ? 'opacity-50 disabled-button' : 'hover:bg-green-600'}`}
                             disabled={!userAnswer.trim()}>Submit</button>
                        )}
                    </div>
                </div>
            );
        };
        
        const App = () => {
            const [mode, setMode] = useState('start');
            if (mode === 'study') return <StudyMode onExit={() => setMode('start')} />;
            if (mode === 'practice') return <PracticeMode onExit={() => setMode('start')} />;
            return (
                <div className="text-center p-8 bg-white rounded-xl shadow-lg max-w-md mx-auto">
                    <h1 className="text-4xl font-bold text-slate-800 mb-2">Formula Writer</h1>
                    <p className="text-slate-600 mb-8">Practice writing chemical formulas.</p>
                    <div className="space-y-4">
                        <button onClick={() => setMode('study')} className="w-full bg-blue-500 text-white font-bold py-4 px-8 rounded-lg text-xl hover:bg-blue-600">Phase 1: Study Mode</button>
                        <button onClick={() => setMode('practice')} className="w-full bg-green-500 text-white font-bold py-4 px-8 rounded-lg text-xl hover:bg-green-600">Phase 2: Practice Mode</button>
                    </div>
                </div>
            );
        };

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
